
# Script generated by Blazemeter Chrome Extension

modules:
  nose:
    ignore-unknown-actions: true
execution:
- executor: selenium
  scenario: demoblaze-selenium-Selenium
  iterations: 1
  capabilities:
    browserName: chrome
scenarios:
  demoblaze-selenium-Selenium:
    generate-flow-markers: true
    headless: false
    timeout: 60s
    think-time: 0s
    requests:
    - label: Test
      actions:
      - type: resizeWindow
        param: '1920,911'
      - type: go
        param: 'https://demoblaze.com/'
      - type: click
        locators:
        - XPath: '//*[text() = "Samsung galaxy s6"]'
        - LinkText: Samsung galaxy s6
        - CSS: a.hrefch
        - XPath: '//a[contains(text(),''Samsung galaxy s6'')]'
        - XPath: '(//a[contains(@href, ''prod.html?idp_=1'')])[2]'
        - XPath: //h4/a
        metadata:
          page-title: STORE
          page-url: 'https://demoblaze.com/'
          screenshot: >-
            data:image/png;base64,
      - type: click
        locators:
        - XPath: '//*[text() = "Add to cart"]'
        - LinkText: Add to cart
        - CSS: a.btn.btn-success.btn-lg
        - XPath: '//a[contains(text(),''Add to cart'')]'
        - XPath: '//a[@onclick=''addToCart(1)'']'
        - XPath: '(//a[contains(@href, ''#'')])[9]'
        - XPath: '//div[2]/div/a'
        metadata:
          page-title: STORE
          page-url: 'https://demoblaze.com/prod.html?idp_=1'
          screenshot: >-
            data:image/png;base64,
      - type: click
        locators:
        - XPath: '//*[contains(text(), "Home")]'
        - CSS: a.nav-link
        - XPath: '//a[contains(text(),''Home (current)'')]'
        - XPath: '(//a[contains(@href, ''index.html'')])[2]'
        - XPath: //li/a
        metadata:
          page-title: STORE
          page-url: 'https://demoblaze.com/prod.html?idp_=1#'
          screenshot: >-
            data:image/png;base64,
